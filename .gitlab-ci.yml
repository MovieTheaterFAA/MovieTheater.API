stages:
  - build
  - deploy

variables:
  DOCKER_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG

build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $DOCKER_IMAGE -f MovieTheater.API/Dockerfile .
    - docker push $DOCKER_IMAGE
  only:
    - main
  cache:
    paths:
      - .docker-cache/

deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    # Setup SSH
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - |
    ssh $VPS_USER@$VPS_HOST "
      cd /root/projects/movietheater &&
      docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY &&
      docker pull $DOCKER_IMAGE &&
      docker image tag $DOCKER_IMAGE movietheaterapi:backup || true &&
      docker compose up -d &&
      docker image prune -f &&
      curl -f http://localhost:5000/health || echo 'WARNING: Healthcheck failed'
    "
  only:
    - main 