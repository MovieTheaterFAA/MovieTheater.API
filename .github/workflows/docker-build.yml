name: Docker Build, Push and Deploy

on:
  push:
    branches:
      - main  # Khi có code mới được push lên nhánh main thì workflow này sẽ chạy

jobs:
  build-push-and-deploy:
    runs-on: ubuntu-latest  # Máy chủ ảo của GitHub cung cấp để chạy pipeline

    steps:
      - name: Checkout source code
        uses: actions/checkout@v3  # Lấy code từ GitHub repository về

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3  # Thiết lập công cụ Buildx của Docker để build hiệu quả hơn

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}  # Đăng nhập Docker Hub bằng secret
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .                         # Thư mục chứa Dockerfile và mã nguồn
          file: MovieTheater.API/Dockerfile  # Vị trí file Dockerfile
          push: true                         # Sau khi build xong thì đẩy (push) lên Docker Hub
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/movietheater-api:latest  # Gán tag cho image
          cache-from: type=gha               # Dùng cache từ GitHub Actions
          cache-to: type=gha,mode=max        # Lưu cache dùng lại lần sau

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3          # Plugin để chạy lệnh SSH từ xa vào VPS
        with:
          host: ${{ secrets.VPS_HOST }}           # IP hoặc domain của VPS (khai báo trong repo secret)
          username: ${{ secrets.VPS_USER }}       # Tên user đăng nhập (thường là root)
          password: ${{ secrets.VPS_PASSWORD }}   # SSH password để đăng nhập

          script: |
            cd /root/projects/movietheater                                          # Di chuyển đến thư mục chứa file docker-compose -f docker-compose.deploy.yml.yml trên VPS

            echo "Pulling latest Docker image..."
            docker compose pull                                                     # Kéo image mới nhất từ Docker Hub

            echo "Backing up previous image tag..."
            docker image tag movietheater-api:latest movietheater-api:backup || true  # Gắn tag dự phòng để rollback nếu cần

            echo "Restarting container..."
            docker compose up -d                                                    # Chạy hoặc restart container với image mới

            echo "Removing dangling images to save space..."
            docker image prune -f                                                   # Xóa những image không dùng tới để tiết kiệm dung lượng ổ đĩa

            echo "Checking health status..."
            curl -f http://localhost:5000/health || echo "WARNING: Healthcheck failed"  
            # Gọi thử endpoint của API xem có chạy không, nếu lỗi thì cảnh báo nhưng không dừng workflow
