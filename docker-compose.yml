services:
  movietheater.api:
    image: ch1mple/movietheater-api:latest
    build:
      context: .
      dockerfile: MovieTheater.API/Dockerfile
    depends_on:
      movietheater.database:
        condition: service_started
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # Xài cloud db trên vps
      - ConnectionStrings__DefaultConnection=Host=103.211.201.162;Port=5434;Database=movietheater_db;Username=postgres;Password=postgres
      # Xài local
      # - ConnectionStrings__DefaultConnection=Host=localhost;Port=5433;Database=movietheater_db;Username=postgres;Password=postgres
      - ConnectionStrings__Redis=movietheater-redis:6379,abortConnect=false
      - JWT__SecretKey=MovieTheater_SECRETKEY_SIEUCAPBAOMAT_VAYMACHUADU16KYTU
      - JWT__Issuer=MovieTheater_Issuer
      - JWT__Audience=MovieTheater_Audience
      - RESEND_APITOKEN=re_d7uvVXic_7nS9QjB6HAYryqrQ2jKsXu7J
      - RESEND_FROM=noreply@ae-tao-fullstack-api.site
      - MINIO_ENDPOINT=103.211.201.162:9000
      - MINIO_HOST=https://minio.fpt-devteam.fun
      - MINIO_ACCESS_KEY=minioadmin 
      - MINIO_SECRET_KEY=minioadmin
    ports:
      - "5000:5000"

  movietheater.database:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: movietheater_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:latest
    container_name: movietheater-redis
    ports:
      - "6380:6379"
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  pgdata:
  redis-data:
